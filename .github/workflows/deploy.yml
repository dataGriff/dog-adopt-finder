name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Deploying the worker does not switch anything on: there is no cron and
    # live fetching stays off until FINDER_LIVE_FETCH is set.
    if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Allow installing @dogadopt/contracts from the private spec repo
        # pnpm clones dog-adopt-spec over git. GITHUB_TOKEN only reads this
        # repository, so a fine-grained PAT with Contents: read on
        # dataGriff/dog-adopt-spec is stored as CONTRACTS_READ_TOKEN. Every
        # GitHub URL form pnpm may use is rewritten to use it.
        env:
          TOKEN: ${{ secrets.CONTRACTS_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          for from in "https://github.com/" "git@github.com:" "ssh://git@github.com/"; do
            git config --global --add url."https://x-access-token:${TOKEN}@github.com/".insteadOf "$from"
          done
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
